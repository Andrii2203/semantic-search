services:
  app:
    build: .
    container_name: semantic-search
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app-data:/app/data
      - model-cache:/app/.cache
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/app.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-content}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.65}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env, sessions are signed with it}
      - SOURCE_TIMEOUT_MS=${SOURCE_TIMEOUT_MS:-10000}
      - HF_HOME=/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  app-data:
    driver: local
  model-cache:
    driver: local
