<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UME — Deprecated UI</title>
  <style>
    body {
      background: #1a0a14; color: rgba(255,255,255,0.5);
      font-family: 'JetBrains Mono', monospace;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; font-size: 13px;
    }
    .box { text-align: center; line-height: 2; }
    a { color: #e95420; }
  </style>
</head>
<body>
  <div class="box">
    <p>This legacy interface is deprecated.</p>
    <p>The new React app runs at <a id="link" href="#">localhost:5173</a></p>
    <p style="opacity:0.3;font-size:11px">Redirecting automatically...</p>
  </div>
  <script>
    var dev = window.location.origin.replace(/:\d+$/, ':5173');
    var link = document.getElementById('link');
    link.href = dev;
    link.textContent = dev;
    if (window.location.port === '3000') {
      setTimeout(function() { window.location.replace(dev); }, 1500);
    }
  </script>
</body>
</html>
